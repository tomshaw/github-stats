name: Generate Stats Images

on:
  push:
    branches: [master]
    paths:
      - "*.py"
      - requirements.txt
      - templates/**
      - .github/workflows/main.yml
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs race to push generated images
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Check out repository under $GITHUB_WORKSPACE, so the job can access it.
      # Credentials are kept so the last step can push the generated images.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked] v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      # Generate all statistics images
      - name: Generate images
        run: python generate_images.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDED: ${{ secrets.EXCLUDED }}
          EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
          EXCLUDE_FORKED_REPOS: true

      # Commit the generated images, if they changed
      - name: Commit to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          if git diff --cached --quiet; then
            echo "Generated images are unchanged"
            exit 0
          fi
          git commit -m "Update generated files"
          git pull --rebase
          git push
